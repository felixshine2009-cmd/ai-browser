<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--bg:#0b1416;--panel:rgba(18,28,31,0.78);--border:rgba(255,255,255,0.12);--text:#e8f0ea;--muted:#8aa096;--accent:#3d9b6e;--btn:rgba(26,40,44,0.75)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}
#chrome{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;min-width:0}
#bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;z-index:2}
#apps{display:flex;gap:4px;flex-wrap:wrap}
#apps button,#acts button{appearance:none;border:1px solid var(--border);background:var(--btn);color:var(--text);border-radius:7px;padding:5px 10px;font:500 12px/1 inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
#apps button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#04140c);font-weight:600}
#apps button:hover,#acts button:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.22)}
#apps button.active:hover{background:#47ad7c;border-color:#47ad7c}
#acts{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
#wrap{flex:1;position:relative;min-height:0;min-width:0;width:100%;overflow:hidden}
#ggb{position:absolute;inset:0;width:100%!important;height:100%!important;overflow:hidden}
/* GeoGebra writes fixed px sizes on its wrappers at inject time; keep them glued to the pane so setSize() can refill it */
#ggb>div,#ggb .applet_scaler{position:absolute!important;inset:0;width:100%!important;height:100%!important;transform:none!important;margin:0!important}
#ggb .GeoGebraFrame{border:0!important;margin:0!important}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px;background:rgba(11,20,22,0.85);backdrop-filter:blur(12px)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(22,53,40,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(95,185,154,0.35);color:#b7f0cf;padding:6px 14px;border-radius:999px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
input[type=file]{display:none}

/* light palettes (data-scheme set by the theme script below) */
html[data-scheme="light"] #apps button:hover,html[data-scheme="light"] #acts button:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.22)}
html[data-scheme="light"] #apps button.active:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
html[data-scheme="light"] #err{background:color-mix(in srgb,var(--bg) 88%,transparent)}
html[data-scheme="light"] #toast{background:#d9f2e6;border-color:rgba(35,128,95,.35);color:#14532d}
</style>
<script src="ggb/deployggb.js"></script>
<script>/* AI Browser light / dark theme: the host page posts {aibTheme:{id,scheme,css}} (src/renderer/static/theme.js) */(function(){function ap(t){if(!t||typeof t.css!=='string')return;var h=document.documentElement;h.setAttribute('data-scheme',t.scheme);h.setAttribute('data-theme',t.id);h.style.colorScheme=t.scheme;var e=document.getElementById('aib-theme-vars');if(!e){e=document.createElement('style');e.id='aib-theme-vars';}(document.head||h).appendChild(e);e.textContent=t.css;}window.addEventListener('message',function(ev){var m=ev.data;if(!m||ev.source!==parent)return;if(m.aibTheme)ap(m.aibTheme);});try{if(parent!==window)parent.postMessage({aibThemeHello:true},'*');}catch(e){}})();</script>
</head><body>
<div id="chrome">
  <div id="bar">
    <div id="apps">
      <button data-app="graphing" class="active" title="函数绘图 (Graphing)">函数绘图</button>
      <button data-app="geometry" title="平面几何 (Geometry)">几何</button>
      <button data-app="3d" title="3D 绘图 (3D Graphics)">3D</button>
      <button data-app="cas" title="符号运算 (CAS)">CAS</button>
      <button data-app="scientific" title="科学计算器 (Scientific)">计算器</button>
      <button data-app="suite" title="综合套件 (Suite)">综合</button>
    </div>
    <div id="acts">
      <button id="kb" title="显示或隐藏数学键盘 (123 / f(x) / ABC / 符号)">⌨ 键盘</button>
      <button id="save" title="保存 .ggb 文件">保存</button>
      <button id="load" title="打开 .ggb 文件">打开</button>
      <button id="png" title="导出 PNG 图片">导出图片</button>
      <button id="clr" title="清空画布">清空</button>
      <input id="file" type="file" accept=".ggb,application/vnd.geogebra.file">
    </div>
  </div>
  <div id="wrap" class="ggb-wrap"><div id="ggb"></div><div id="err"></div><div id="toast"></div></div>
</div>
<script>
(function () {
  var applet = null, currentApp = 'graphing', readyRes, readyRej, kbOpen = false;
  var ready = new Promise(function (a, b) { readyRes = a; readyRej = b; });
  var toastEl = document.getElementById('toast'), toastT;
  function toast(m) { toastEl.textContent = m; toastEl.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.style.opacity = '0'; }, 1800); }
  function size() {
    var w = document.getElementById('wrap');
    var r = w ? w.getBoundingClientRect() : { width: 0, height: 0 };
    var cw = Math.floor(r.width || (w && w.clientWidth) || window.innerWidth || 640);
    var ch = Math.floor(r.height || (w && w.clientHeight) || (window.innerHeight - 42) || 480);
    return { w: Math.max(320, cw), h: Math.max(220, ch) };
  }
  var lastW = 0, lastH = 0, resizeRaf = 0;
  function syncSize(force) {
    if (!applet || !applet.setSize) return;
    var s = size();
    if (!force && Math.abs(s.w - lastW) < 2 && Math.abs(s.h - lastH) < 2) return;
    lastW = s.w; lastH = s.h;
    try { applet.setSize(s.w, s.h); } catch (e) {}
    try { if (applet.recalculateEnvironments) applet.recalculateEnvironments(); } catch (e) {}
  }
  function scheduleResize(force) {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function () {
      resizeRaf = 0;
      syncSize(force);
    });
  }
  // One codebase per page: GGBApplet cannot switch codebases after the first load, and web3d supports every app.
  function codebaseFor(app) { return 'ggb/HTML5/5.0/web3d/'; }
  function paramsFor(app) {
    var s = size();
    lastW = s.w; lastH = s.h;
    return {
      appName: app, width: s.w, height: s.h,
      showToolBar: true, showToolBarHelp: false, customToolBar: '',
      showAlgebraInput: true, showMenuBar: false, showResetIcon: false,
      enableRightClick: true, enableShiftDragZoom: true, useBrowserForJS: true,
      borderColor: '#0b1416', showFullscreenButton: false, language: 'zh',
      showKeyboardOnFocus: false, allowUpscale: false, autoHeight: false,
      enableFileFeatures: false, showZoomButtons: true,
      appletOnLoad: function (api) {
        applet = api; readyRes(api); ready = Promise.resolve(api);
        try { var er = document.getElementById('err'); if (er) er.style.display = 'none'; } catch (e) {}
        syncSize(true);
        setTimeout(function () { syncSize(true); }, 80);
        setTimeout(function () { syncSize(true); }, 260);
        try { if (app === 'graphing' || app === 'geometry') api.setCoordSystem(-8, 8, -5, 5); } catch (e) {}
        try { parent.postMessage({ aibPanelEvent: 'ready', app: app }, '*'); } catch (e) {}
      }
    };
  }
  function inject(app) {
    applet = null; kbOpen = false;
    ready = new Promise(function (a, b) { readyRes = a; readyRej = b; });
    document.getElementById('ggb').innerHTML = '';
    document.getElementById('err').style.display = 'none';
    currentApp = app;
    document.querySelectorAll('#apps button').forEach(function (b) { b.classList.toggle('active', b.dataset.app === app); });
    var a = new GGBApplet(paramsFor(app), true);
    a.setHTML5Codebase(codebaseFor(app));
    a.inject('ggb');
    setTimeout(function () {
      if (!applet && currentApp === app) {
        var e = document.getElementById('err'); e.style.display = 'flex';
        e.textContent = 'GeoGebra 加载较慢，仍在继续加载（' + app + '）';
        // fail the calls waiting now with a clear message, but keep a fresh promise so a late load still serves later calls
        var rej = readyRej; ready = new Promise(function (a, b) { readyRes = a; readyRej = b; });
        rej(new Error('GeoGebra 组件尚未加载完成，请稍后重试'));
      }
    }, 100000);
  }
  function focusInput() {
    var sels = [
      '.algebraView .newRadioButtonPanel input', '.algebraPanel input',
      'input.gwt-TextBox', 'textarea.gwt-TextArea',
      '.AlgebraInput input', '.algebraEditor', '[class*="AlgebraInput"] input',
      '[class*="mathField"]', '.avInput', '#InputBox'
    ];
    for (var i = 0; i < sels.length; i++) {
      var el = document.querySelector(sels[i]);
      if (el) { try { el.focus(); el.click(); return true; } catch (e) {} }
    }
    return false;
  }
  async function toggleKeyboard() {
    var api = await ready;
    kbOpen = !kbOpen;
    try { if (api.showKeyboard) api.showKeyboard(kbOpen); } catch (e) {}
    if (kbOpen) {
      if (!focusInput()) toast('请在左侧代数输入栏中点击，以显示数学键盘');
      else toast('已开启数学键盘');
    } else {
      toast('已收起数学键盘');
    }
    setTimeout(function () { syncSize(true); }, 60);
  }
  window.addEventListener('resize', function () { scheduleResize(false); });
  document.getElementById('apps').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-app]'); if (!b) return;
    if (b.dataset.app === currentApp) return;
    inject(b.dataset.app);
  });
  document.getElementById('kb').onclick = function () { toggleKeyboard(); };
  document.getElementById('clr').onclick = async function () { var api = await ready; api.newConstruction(); toast('已清空画布'); };
  document.getElementById('png').onclick = async function () {
    var api = await ready; var b = api.getPNGBase64(1, true, 72);
    try { parent.postMessage({ aibPanelEvent: 'png', data: 'data:image/png;base64,' + b }, '*'); } catch (e) {}
    toast('已导出 PNG');
  };
  document.getElementById('save').onclick = async function () {
    var api = await ready; var b64 = api.getBase64();
    var bin = atob(b64), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.geogebra.file' }));
    a.download = 'construction.ggb'; a.click(); URL.revokeObjectURL(a.href); toast('已保存 .ggb');
  };
  document.getElementById('load').onclick = function () { document.getElementById('file').click(); };
  document.getElementById('file').onchange = async function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    var api = await ready; var buf = await f.arrayBuffer();
    var u8 = new Uint8Array(buf), s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    try { api.setBase64(btoa(s)); toast('已打开 ' + f.name); } catch (e) { toast('打开失败：' + e.message); }
  };

  var methods = {
    eval: async function (a) {
      var api = await ready, res = [];
      (a.commands || []).forEach(function (c) {
        var ok = false, scripting = /^\s*(Set|Show|Hide|Zoom|Pan|Rename|Delete|Execute|Update|Center|Start|Pause|Run|Select|Deselect|Unlink|Lock)[A-Za-z]*\s*\(/i.test(String(c));
        try { ok = api.evalCommand(String(c)); if (!ok && scripting) ok = true; } catch (e) { ok = false; }
        res.push({ cmd: c, ok: !!ok });
      });
      return { results: res, objects: api.getAllObjectNames(), count: api.getObjectNumber(), app: currentApp };
    },
    clear: async function () { var api = await ready; api.newConstruction(); try { api.setCoordSystem(-8, 8, -5, 5); } catch (e) {} return { ok: true, count: api.getObjectNumber() }; },
    exportPng: async function () {
      var api = await ready; var b = api.getPNGBase64(1, true, 72);
      try { parent.postMessage({ aibPanelEvent: 'png', data: 'data:image/png;base64,' + b }, '*'); } catch (e) {}
      return { ok: true, bytes: Math.floor(b.length * 3 / 4) };
    },
    setApp: async function (a) { var app = (a && a.app) || 'graphing'; if (app !== currentApp) inject(app); await ready; return { app: currentApp }; },
    getBase64: async function () { var api = await ready; return { ggb: api.getBase64(), app: currentApp }; },
    setBase64: async function (a) { var api = await ready; api.setBase64(String(a.ggb || a.base64 || '')); return { ok: true, objects: api.getAllObjectNames() }; },
    showKeyboard: async function () { await toggleKeyboard(); return { ok: true }; },
    state: async function () {
      var api = await ready; var names = api.getAllObjectNames();
      return { app: currentApp, objects: names.map(function (n) { return { name: n, type: api.getObjectType(n), def: api.getCommandString(n) }; }) };
    }
  };
  window.addEventListener('message', function (ev) {
    var m = ev.data; if (ev.source !== parent || !m || !m.aibPanelCall) return;
    Promise.resolve().then(function () { return methods[m.method]((m.args) || {}); })
      .then(function (r) { parent.postMessage({ aibPanelReply: m.aibPanelCall, result: r }, '*'); },
           function (e) { parent.postMessage({ aibPanelReply: m.aibPanelCall, error: String(e && e.message || e) }, '*'); });
  });
  if (window.ResizeObserver) {
    new ResizeObserver(function () { scheduleResize(false); }).observe(document.getElementById('wrap'));
  }
  var prevW = 0, prevH = 0, stableCount = 0;
  (function waitSize(n) {
    var w = document.getElementById('wrap');
    var r = w ? w.getBoundingClientRect() : { width: 0, height: 0 };
    var cw = Math.floor(r.width || (w && w.clientWidth) || 0);
    var ch = Math.floor(r.height || (w && w.clientHeight) || 0);
    // Avoid default 300x150 unstyled iframe size; wait until layout dimensions settle
    if (cw > 320 && ch > 220 && cw === prevW && ch === prevH) {
      stableCount++;
    } else {
      stableCount = 0;
      prevW = cw;
      prevH = ch;
    }
    // rAF does not fire in a hidden / off-screen WebKit iframe, so poll with a timer too and give up waiting after ~2 s
    if (stableCount >= 2 || n > 36) inject('graphing');
    else { var done = false; var next = function () { if (!done) { done = true; waitSize(n + 1); } };
      requestAnimationFrame(next); setTimeout(next, 60); }
  })(0);
})();
</script></body></html>
