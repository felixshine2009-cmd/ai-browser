name: iPad IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ipad-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble web assets
        run: bash scripts/build-web.sh "$GITHUB_WORKSPACE/dist-web"

      - name: Copy web assets into Capacitor www
        run: |
          python3 - << 'PY'
          import shutil
          from pathlib import Path
          src = Path('dist-web')
          dst = Path('mobile/www')
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst, ignore=shutil.ignore_patterns('.git'))
          if not (dst / 'index.html').is_file():
              raise SystemExit('mobile/www/index.html missing after copy')
          print('copied', src, '->', dst)
          PY

      - name: Embed the Linux VM (v86 + Alpine Linux) into www/vm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VM_RELEASE: v5.3.0
        run: |
          set -euo pipefail
          gh release download "$VM_RELEASE" -p 'linux-vm-x86-v86.tar.gz' -D /tmp
          tar -C mobile/www -xzf /tmp/linux-vm-x86-v86.tar.gz
          test -f mobile/www/vm/manifest.json
          du -sh mobile/www/vm
          cat mobile/www/vm/manifest.json

      - name: Smoke-test the embedded Linux VM (boots in v86, runs Python)
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/v86-smoke.cjs mobile/www/vm

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios

      - name: Archive unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -workspace mobile/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find "$PWD/build/App.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" "Payload/$(basename "$APP")"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "Payload/$(basename "$APP")/Info.plist")
          echo "CFBundleShortVersionString=$VER"
          if [[ "${GITHUB_REF_NAME:-}" == ipad-v* ]] && [[ "$VER" != "${GITHUB_REF_NAME#ipad-v}" ]]; then echo "version $VER does not match tag $GITHUB_REF_NAME"; exit 1; fi
          zip -r AI-Browser-iPad-unsigned.ipa Payload
          ls -lh AI-Browser-iPad-unsigned.ipa
          unzip -l AI-Browser-iPad-unsigned.ipa | tail -1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-iPad-unsigned
          path: AI-Browser-iPad-unsigned.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/ipad-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" AI-Browser-iPad-unsigned.ipa --clobber
