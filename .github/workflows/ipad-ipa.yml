name: iPad IPA

# ipad-v2+: the desktop app ported to iPad (native Swift host + embedded Node.js + llama.cpp Metal).
#  sim-test  (Linux)  the whole iPad payload in the host simulator (ipad/sim) under Node 18 = nodejs-mobile
#  build     (macOS)  XcodeGen project -> unsigned IPA, attached to the ipad-v* release
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (macos-26 has Xcode 26 for Liquid Glass; macos-15 builds the material fallback)
        default: macos-26
      release_tag:
        description: attach the IPA to this ipad-v* release (optional)
        default: ''
  push:
    tags:
      - 'ipad-v*'
    branches:
      - 'ipad-native*'

permissions:
  contents: write

env:
  NODE_MOBILE: v18.20.4
  LLAMA_CPP: b12314
  VM_RELEASE: v5.6.0

jobs:
  # nodejs-mobile is Node 18 built without ICU (v8_enable_i18n_support=0): no Intl, TextDecoder only utf-8 / utf-16le.
  # Official Node builds have full ICU and would hide such failures, so the simulator runs a Node built the same way.
  node-noicu:
    # manual re-runs that only attach an IPA to a release skip the Linux jobs
    if: inputs.release_tag == '' || inputs.release_tag == null
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/node18-noicu
          key: node-v18.20.4-linux-x64-intl-none-v1
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Build Node 18.20.4 --with-intl=none (cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/node-v18.20.4"
          pip install setuptools
          ./configure --with-intl=none --without-npm --without-corepack
          make -j"$(nproc)"
          mkdir -p ~/node18-noicu && cp out/Release/node ~/node18-noicu/node
      - run: ~/node18-noicu/node -p "process.version + ' intl=' + typeof Intl"
      - uses: actions/upload-artifact@v4
        with:
          name: node18-noicu
          path: ~/node18-noicu/node
          retention-days: 3

  sim-test:
    needs: node-noicu
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (Electron for the simulator, Playwright core)
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: node18-noicu
          path: ${{ runner.temp }}/node18-noicu
      - name: Node 18 without ICU (same build options as nodejs-mobile)
        run: |
          chmod +x "$RUNNER_TEMP/node18-noicu/node"
          "$RUNNER_TEMP/node18-noicu/node" -p "process.version + ' intl=' + typeof Intl"
          echo "AIB_NODE=$RUNNER_TEMP/node18-noicu/node" >> "$GITHUB_ENV"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg libnss3 libasound2t64 libgbm1 || sudo apt-get install -y xvfb ffmpeg libnss3 libgbm1
      - name: Build the iPad payload (+ Pyodide, Linux VM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/build-ipad-bundle.js dist/ipad-bundle
          node scripts/fetch-ipad-pyodide.js dist/ipad-bundle --cache "$RUNNER_TEMP/pyodide"
          gh release download "$VM_RELEASE" -p 'linux-vm-x86-v86.tar.gz' -D "$RUNNER_TEMP"
          tar -C dist/ipad-bundle -xzf "$RUNNER_TEMP/linux-vm-x86-v86.tar.gz"
      - name: Device runtime check (no ICU, no JIT)
        run: '"$AIB_NODE" --jitless scripts/check-ipad-runtime.js dist/ipad-bundle/nodejs-project --require-no-icu'
      - name: Simulator tests (iPad build) + appearance tests
        env:
          AIB_IPAD_BUNDLE: ${{ github.workspace }}/dist/ipad-bundle
          AIB_IPAD_SHOTS: ${{ github.workspace }}/shots/ipad2
        run: node scripts/run-tests.js 36-ipad-sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-sim-screenshots
          path: shots/ipad2

  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Xcode
        run: |
          set -euo pipefail
          # v3: prefer the newest Xcode 26.x (iPadOS 26 SDK: UIGlassEffect / Liquid Glass chrome), else Xcode 16.4 / 16.x
          # (the Swift code compiles its material fallback there), else any installed Xcode
          ls -d /Applications/Xcode*.app || true
          X=""
          for c in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V -r) /Applications/Xcode_16.4.app $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r) $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [[ -d "$c/Contents/Developer" ]]; then X="$c"; break; fi
          done
          if [[ -n "$X" ]]; then sudo xcode-select -s "$X/Contents/Developer"; else echo "no Xcode.app found, keeping $(xcode-select -p)"; fi
          xcode-select -p
          xcodebuild -version
      - name: Payload (desktop main process + pages + iPad layer)
        run: node scripts/build-ipad-bundle.js ipad/build/aibapp
      - name: "Payload: Pyodide (embedded Python)"
        run: node scripts/fetch-ipad-pyodide.js ipad/build/aibapp --cache "$RUNNER_TEMP/pyodide"
      - name: "Payload: Linux VM emulator (v86 only; the Alpine image is downloaded on first use)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VM_RELEASE" -p 'linux-vm-x86-v86.tar.gz' -D "$RUNNER_TEMP"
          # v3.0.0: no VM images and no model files inside the IPA — only the emulator and its BIOS files
          tar -C ipad/build/aibapp -xzf "$RUNNER_TEMP/linux-vm-x86-v86.tar.gz" vm/libv86.js vm/v86.wasm vm/seabios.bin vm/vgabios.bin vm/LICENSE-v86.txt
          test -f ipad/build/aibapp/vm/v86.wasm && test ! -e ipad/build/aibapp/vm/fs.json && test ! -e ipad/build/aibapp/vm/bzImage
          du -sh ipad/build/aibapp/*
          # iOS install verification rejects bundles some re-signers mangle: no symlinks inside the .app
          find ipad/build/aibapp -type l -print -delete
      - name: Frameworks (nodejs-mobile, llama.cpp)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ipad/Frameworks "$RUNNER_TEMP/fw"
          gh release download "$NODE_MOBILE" -R nodejs-mobile/nodejs-mobile -p "nodejs-mobile-$NODE_MOBILE-ios.zip" -D "$RUNNER_TEMP/fw"
          unzip -q "$RUNNER_TEMP/fw/nodejs-mobile-$NODE_MOBILE-ios.zip" 'NodeMobile.xcframework/*' -d ipad/Frameworks
          gh release download "$LLAMA_CPP" -R ggml-org/llama.cpp -p "llama-$LLAMA_CPP-xcframework.zip" -D "$RUNNER_TEMP/fw"
          unzip -q "$RUNNER_TEMP/fw/llama-$LLAMA_CPP-xcframework.zip" -d "$RUNNER_TEMP/fw/llama"
          cp -R "$(find "$RUNNER_TEMP/fw/llama" -name llama.xcframework -type d | head -1)" ipad/Frameworks/
          ls ipad/Frameworks
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ipad && xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ipad/AIBrowser.xcodeproj -scheme AIBrowser -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/AIBrowser.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" archive | tee build.log | grep -E "error:|warning: .*(Swift|swift)|BUILD|ARCHIVE" || true
          test -d build/AIBrowser.xcarchive/Products/Applications/AIBrowser.app || { grep -E "error" -A3 build.log | head -80; exit 1; }
      - name: Package unsigned IPA
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          APP=build/AIBrowser.xcarchive/Products/Applications/AIBrowser.app
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/AIBrowser.app/Info.plist)
          echo "CFBundleShortVersionString=$VER"
          if [[ "${GITHUB_REF_NAME:-}" == ipad-v* ]] && [[ "$VER" != "${GITHUB_REF_NAME#ipad-v}" ]]; then echo "version $VER does not match tag $GITHUB_REF_NAME"; exit 1; fi
          if [[ -n "${RELEASE_TAG:-}" ]] && [[ "$VER" != "${RELEASE_TAG#ipad-v}" ]]; then echo "version $VER does not match release $RELEASE_TAG"; exit 1; fi
          test -f Payload/AIBrowser.app/aibapp/nodejs-project/main-ipad.js
          test -f Payload/AIBrowser.app/aibapp/nodejs-project/wasm-shim.js
          test -f Payload/AIBrowser.app/aibapp/nodejs-project/polywasm.js
          test -d Payload/AIBrowser.app/Frameworks/NodeMobile.framework
          test -d Payload/AIBrowser.app/Frameworks/llama.framework
          # normalise permissions: only Mach-O binaries are executable (re-signers and installd verify these)
          find Payload -type l -print -delete
          find Payload -type f -exec chmod 644 {} +
          chmod 755 Payload/AIBrowser.app/AIBrowser Payload/AIBrowser.app/Frameworks/llama.framework/llama
          chmod 755 Payload/AIBrowser.app/Frameworks/NodeMobile.framework/NodeMobile
          # no VM images or model weights may be embedded (they are downloaded on demand)
          if find Payload \( -name '*.gguf' -o -name '*.safetensors' -o -name '*.mlpackage' -o -name '*.qcow2' -o -name '*.img' -o -path '*/vm/fs/*' -o -path '*/vm/fs.json' -o -path '*/vm/bzImage' \) -print | grep -q .; then echo "VM image or model file inside the IPA"; exit 1; fi
          zip -qry AI-Browser-iPad-unsigned.ipa Payload
          ls -lh AI-Browser-iPad-unsigned.ipa
          SIZE=$(stat -f %z AI-Browser-iPad-unsigned.ipa)
          echo "IPA size: $((SIZE / 1048576)) MB (limit 500 MB)"
          du -sh Payload/AIBrowser.app/* Payload/AIBrowser.app/aibapp/* Payload/AIBrowser.app/Frameworks/* 2>/dev/null | sort -h | tail -15
          test "$SIZE" -lt $((500 * 1048576)) || { echo "IPA exceeds 500 MB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-iPad-unsigned
          path: AI-Browser-iPad-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build.log
      - name: Attach IPA to the GitHub release
        if: startsWith(github.ref, 'refs/tags/ipad-v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" AI-Browser-iPad-unsigned.ipa --clobber

  # The app on a real iOS Simulator: every file import entry goes through UIDocumentPickerViewController and the Swift
  # import code (the Linux host simulator above fakes the picker). Screenshots and the result bundle are uploaded.
  ios-sim-test:
    if: inputs.release_tag == '' || inputs.release_tag == null
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16'
            ios: '18'
          - runner: macos-26
            xcode: '26'
            ios: '26'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          X=""
          for c in $(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app 2>/dev/null | sort -V -r) $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [[ -d "$c/Contents/Developer" ]]; then X="$c"; break; fi
          done
          if [[ -n "$X" ]]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Payload and fixtures
        run: |
          set -euo pipefail
          node scripts/build-ipad-bundle.js ipad/build/aibapp
          find ipad/build/aibapp -type l -print -delete
          mkdir -p "$RUNNER_TEMP/fxmods" && (cd "$RUNNER_TEMP/fxmods" && npm init -y >/dev/null && npm i --no-audit --no-fund adm-zip >/dev/null)
          NODE_PATH="$RUNNER_TEMP/fxmods/node_modules" node ipad/UITests/make-fixtures.js "$RUNNER_TEMP/uitest"
      - name: Frameworks (nodejs-mobile)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ipad/Frameworks "$RUNNER_TEMP/fw"
          gh release download "$NODE_MOBILE" -R nodejs-mobile/nodejs-mobile -p "nodejs-mobile-$NODE_MOBILE-ios.zip" -D "$RUNNER_TEMP/fw"
          unzip -q "$RUNNER_TEMP/fw/nodejs-mobile-$NODE_MOBILE-ios.zip" 'NodeMobile.xcframework/*' -d ipad/Frameworks
          ls ipad/Frameworks/*.xcframework
      - name: Generate the Xcode project (without llama.xcframework, which has no simulator slice)
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import re
          p = 'ipad/project.yml'; s = open(p).read()
          s = re.sub(r"      - framework: Frameworks/llama.xcframework\n        embed: true\n        codeSign: false\n", "", s)
          open(p, 'w').write(s)
          PY
          ! grep -q llama.xcframework ipad/project.yml
          cd ipad && xcodegen generate
      - name: iPad simulator
        run: |
          set -euo pipefail
          export IOS="${{ matrix.ios }}"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,os
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,l in d.items() if "iOS" in rt for x in l if x["name"].startswith("iPad")]
          c=[t for t in c if ("iOS-" + os.environ["IOS"] + "-") in t[0]] or c
          c.sort(key=lambda t:(t[0], "Pro" in t[1]["name"], "13" in t[1]["name"]), reverse=True)
          print(c[0][1]["udid"]); print(c[0][0], c[0][1]["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for testing (simulator)
        run: |
          set -o pipefail
          xcodebuild -project ipad/AIBrowser.xcodeproj -scheme AIBrowser -configuration Debug -destination "id=$UDID" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build-for-testing | tee sim-build.log | grep -E "error:|BUILD|TEST BUILD" || true
          test -d build/dd/Build/Products/Debug-iphonesimulator/AIBrowser.app || { grep -E "error" -A3 sim-build.log | head -80; exit 1; }
      - name: Install the app and put the fixtures into its Documents folder (visible in Files ▸ On My iPad)
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/AIBrowser.app
          C=$(xcrun simctl get_app_container "$UDID" io.github.felixshine2009.aibrowser.ipad data)
          mkdir -p "$C/Documents/uitest" && cp -R "$RUNNER_TEMP/uitest/." "$C/Documents/uitest/"
          find "$C/Documents/uitest" | head -40
      - name: Import tests (every entry, picker answered like the system)
        env:
          TEST_RUNNER_AIB_UITEST_SHOTS: ${{ github.workspace }}/shots/ios-sim
          TEST_RUNNER_AIB_UITEST_FIXTURES: ${{ runner.temp }}/uitest
        run: |
          set -o pipefail
          xcodebuild -project ipad/AIBrowser.xcodeproj -scheme AIBrowser -configuration Debug -destination "id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/import.xcresult CODE_SIGNING_ALLOWED=NO \
            -only-testing:AIBrowserUITests/ImportTests/testEveryImportEntry test-without-building | tee sim-test.log | grep -E "Test Case|error|passed|failed|XCTAssert" 
      - name: Real Files picker (browse, select, Open)
        env:
          TEST_RUNNER_AIB_UITEST_SHOTS: ${{ github.workspace }}/shots/ios-sim
          TEST_RUNNER_AIB_UITEST_FIXTURES: ${{ runner.temp }}/uitest
        run: |
          set -o pipefail
          xcodebuild -project ipad/AIBrowser.xcodeproj -scheme AIBrowser -configuration Debug -destination "id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/realpicker.xcresult CODE_SIGNING_ALLOWED=NO \
            -only-testing:AIBrowserUITests/ImportTests/testRealFilesPickerOpensDictionary test-without-building | tee sim-test-real.log | grep -E "Test Case|error|passed|failed|XCTAssert"
      - name: Logs
        if: always()
        run: |
          mkdir -p shots/ios-sim
          xcrun simctl spawn "$UDID" log show --last 60m --style compact --predicate 'eventMessage CONTAINS "[aib"' > shots/ios-sim/app-log.txt 2>&1 || true
          C=$(xcrun simctl get_app_container "$UDID" io.github.felixshine2009.aibrowser.ipad data 2>/dev/null) && find "$C" -name '*.log' -size -5M -exec cp {} shots/ios-sim/ \; || true
          cp sim-*.log shots/ios-sim/ 2>/dev/null || true
          ls -la shots/ios-sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-${{ matrix.runner }}
          path: |
            shots/ios-sim
            build/*.xcresult
