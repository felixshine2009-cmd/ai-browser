<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1416">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="AI Browser web — chat, GeoGebra, physics, dictionary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<script src="js/theme-boot.js"></script>
<title>AI Browser</title>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="tabs">
      <div class="tab active" data-i18n="chat">Chat</div>
      <div class="tab disabled" data-desktop-only data-i18n="newIncog">Incognito</div>
      <div class="tab disabled" data-desktop-only>+</div>
    </div>
    <div id="toolbar">
      <div id="modeseg">
        <button type="button" class="seg active" data-mode="chat" data-i18n="chat">Chat</button>
        <button type="button" class="seg" data-mode="search" data-i18n="search">Search</button>
      </div>
      <input id="addr" class="disabled" data-desktop-only readonly placeholder="aibrowser://home" title="Desktop only">
      <button type="button" id="btnGgb" data-i18n="ggb">GeoGebra</button>
      <button type="button" id="btnPhys" data-i18n="phys">Physics</button>
      <button type="button" id="btnSolve" data-i18n="solve">解题</button>
      <button type="button" id="btnWiki" data-i18n="wiki">百科</button>
      <button type="button" class="disabled" data-desktop-only id="btnSiri" data-i18n="siri">Siri</button>
      <button type="button" class="disabled" data-desktop-only id="btnTask" data-i18n="task">Task</button>
      <button type="button" class="disabled" data-desktop-only id="btnKernel" data-i18n="kernel">内核</button>
      <button type="button" class="disabled" data-desktop-only id="btnMt" data-i18n="mt">多线程下载</button>
      <button type="button" class="disabled" data-desktop-only data-i18n="extensions">Ext</button>
      <button type="button" class="disabled" data-desktop-only data-i18n="passwords">Passwords</button>
      <button type="button" class="disabled" data-desktop-only data-i18n="print">Print</button>
      <button type="button" id="btnSettings" data-i18n="settings">Settings</button>
    </div>
  </header>
  <main id="main">
    <section id="chatcol">
      <div class="greet" id="greet">Hello</div>
      <p class="note-desk" data-i18n="deskNote"></p>
      <p class="hint" data-i18n="addHome"></p>
      <div id="askrow">
        <textarea id="q" rows="3" data-i18n-ph="askPlaceholder" placeholder="Ask…"></textarea>
        <div id="vkhost"></div>
        <div class="row-actions">
          <div class="model-host" id="askModel"></div>
          <button type="button" class="primary" id="btnSend" data-i18n="send">Send</button>
          <button type="button" id="btnNewChat" data-i18n="newChat">New chat</button>
          <button type="button" id="btnLocal" data-i18n="localModels">Local models</button>
        </div>
        <div class="home-tools" id="hometools"></div>
      </div>
      <section id="solvebox">
        <h3 data-i18n="solve">解题</h3>
        <textarea id="solveText" rows="3" placeholder="输入或粘贴题目"></textarea>
        <div class="row-actions">
          <div class="model-host" id="solveModel"></div>
          <button type="button" id="solveImg">上传图片</button>
          <button type="button" id="solvePhone" data-i18n="phone">拍照上传</button>
          <button type="button" id="solveGo">求解</button>
        </div>
        <input id="solveFile" type="file" accept="image/*" hidden>
        <input id="solveCamera" type="file" accept="image/*" capture="environment" hidden>
        <div id="solvePreview" class="hint"></div>
        <div id="solveQr" class="hint"></div>
        <input id="refTitle" placeholder="参考资料标题">
        <textarea id="refBody" rows="2" placeholder="参考资料"></textarea>
        <button type="button" id="refAdd">添加参考资料</button>
        <div id="refList" class="hint"></div>
      </section>
      <section id="wikibox">
        <h3 data-i18n="wiki">百科</h3>
        <p class="hint">请打开 ZIM 格式的离线百科文件（与 Kiwix 应用所使用的格式相同），然后检索并阅读词条。</p>
        <form id="wikiForm" autocomplete="off">
          <input id="wikiQ" placeholder="请输入检索词" autocomplete="off">
          <div class="row-actions"><button type="submit" class="primary">检索</button></div>
        </form>
        <div class="row-actions">
          <label class="primary" for="zimFile">打开 ZIM 文件</label>
          <input id="zimFile" type="file" accept=".zim,application/octet-stream" hidden>
        </div>
        <p id="zimst" class="hint"></p>
        <div id="wikiHits"></div>
        <section id="wikiReader" class="wiki-reader" hidden>
          <div class="wiki-reader-bar">
            <button type="button" id="wikiHome">首页</button>
            <span id="wikiArtTitle" class="wiki-art-title"></span>
          </div>
          <iframe id="wikiFrame" class="wiki-frame" title="离线百科词条" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
        </section>
      </section>
      <section id="dictbox">
        <h3 data-i18n="dict">词典</h3>
        <p class="hint">请输入英文或中文词汇。查询结果将以词条窗口弹出；若本地词典未收录该词，仍可查看 AI 生成词条。</p>
        <form id="dictForm" autocomplete="off">
          <input id="dictQ" placeholder="请输入英文或中文词汇，例如 serendipity" autocomplete="off">
          <div class="row-actions"><button type="submit" class="primary">查询</button></div>
        </form>
      </section>
      <div id="dictPop" class="qr-modal" hidden>
        <div class="qr-card" role="dialog" aria-modal="true" aria-label="词条">
          <button type="button" class="qr-close" id="dictPopX" title="关闭" aria-label="关闭">×</button>
          <h3 id="dictPopWord"></h3>
          <p id="dictPopNote" class="hint"></p>
          <div id="dictPopStatus" class="status"></div>
          <div id="dictPopBody" class="answer"></div>
        </div>
      </div>
      <div id="tools" class="status"></div>
      <div id="status" class="status"></div>
      <details id="thinkbox" class="think-box" hidden><summary id="thinksum"></summary><div id="thinking" class="think-body"></div></details>
      <div id="answer" class="answer"></div>
      <h3 data-i18n="kb">KB</h3>
      <textarea id="kbText" rows="2" placeholder="Paste text…"></textarea>
      <div class="row-actions">
        <button type="button" id="kbAdd" data-i18n="kbAdd">Add</button>
        <button type="button" id="kbClear" data-i18n="clear">Clear</button>
      </div>
      <input id="kbQuery" data-i18n-ph="kbSearch" placeholder="Search KB">
      <div id="kbList"></div>
    </section>
    <section id="panelcol"><div id="panelTabs"><button type="button" id="ptGgb" data-i18n="ggb">GeoGebra</button><button type="button" id="ptPhys" data-i18n="phys">Physics</button></div><button type="button" id="btnClosePanel" aria-label="Close" data-i18n-title="close">✕</button><div id="plotcanvas" style="height:100%;min-height:280px"></div></section>
    <aside id="sidecol">
      <h3 data-i18n="sources">Sources</h3>
      <p class="hint" data-i18n="offline"></p>
      <button type="button" class="disabled" data-desktop-only data-i18n="bookmarks">Bookmarks</button>
      <button type="button" class="disabled" data-desktop-only data-i18n="downloads">Downloads</button>
      <button type="button" class="disabled" data-desktop-only data-i18n="find">Find</button>
      <button type="button" class="disabled" data-desktop-only data-i18n="zoom">Zoom</button>
    </aside>
  </main>
</div>
<div id="toast" role="status"></div>
<div id="settings" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2 data-i18n="settings">Settings</h2>
    <div class="form-row"><label data-i18n="displayName">Name</label><input id="dname"></div>
    <div class="form-row"><label data-i18n="greeting">Greeting</label><input id="greeting" placeholder="{name}"></div>
    <div class="form-row"><label data-i18n="appearance">外观</label><div id="themeMode" class="seg-row" role="radiogroup"></div><div class="hint" data-i18n="appearanceHint">「跟随系统」时随系统的浅色 / 深色外观自动切换下面两套主题。</div></div>
    <div class="form-row"><label data-i18n="darkTheme">深色主题</label><div id="themeGrid" class="theme-grid"></div></div>
    <div class="form-row"><label data-i18n="lightTheme">浅色主题</label><div id="themeGridLight" class="theme-grid"></div></div>
    <div class="form-row"><label data-i18n="answerStyle">回答风格</label>
      <select id="astyle"><option value="concise">简洁</option><option value="detailed">详细</option><option value="steps">步骤</option></select>
    </div>
    <div class="form-row"><label data-i18n="thinking">思考等级</label>
      <select id="think"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="max">max</option></select>
    </div>
    <div class="form-row"><label data-i18n="lang">Lang</label>
      <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
    </div>
    <div class="form-row"><label data-i18n="provider">服务商</label><select id="apiPreset"></select></div>
    <div class="form-row"><label data-i18n="apiBase">API Base</label><input id="apiBase" placeholder="https://api.deepseek.com/v1" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"></div>
    <div class="form-row"><label data-i18n="apiKey">API Key</label><div class="keyrow"><input id="apiKey" name="aib-api-secret" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true"><button type="button" id="btnShowKey" aria-label="Show / hide key" data-i18n="show">Show</button></div></div>
    <div class="form-row"><label data-i18n="apiModel">Model</label><input id="apiModel" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="form-row"><label>模型列表</label><div id="provModels" class="prov-models"></div></div>
    <p class="hint" data-i18n="corsHint"></p>
    <div class="form-row"><label data-i18n="engineKind">Chat engine</label>
      <select id="engKind"><option value="api" data-i18n="engineApi">Custom API</option><option value="local" data-i18n="engineLocal">Local WebGPU</option></select>
      <span id="webgpuBadge" class="hint"></span>
    </div>
    <p id="webgpuReason" class="hint warn" style="display:none"></p>
    <div id="localBlock" class="form-row" style="display:none">
      <label data-i18n="localModels">Local</label>
      <select id="localModel"></select>
      <p class="hint" data-i18n="localHint"></p>
      <p id="localWarn" class="hint warn" style="display:none"></p>
      <div class="row-actions">
        <button type="button" id="btnLoadLocal" data-i18n="localLoad">Load</button>
        <button type="button" id="btnPauseLocal" data-i18n="localPause" style="display:none">Pause</button>
        <button type="button" id="btnResumeLocal" data-i18n="localResume" style="display:none">Resume</button>
        <button type="button" id="btnUnloadLocal" data-i18n="localUnload">Unload</button>
      </div>
      <div id="localProg" class="status" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      <div id="localCache" class="hint"></div>
      <div id="localDisk"></div>
    </div>
    <div class="form-row"><label data-i18n="searchEngine">Search</label>
      <select id="engine"><option value="baidu">Baidu</option><option value="bing">Bing</option><option value="google">Google</option><option value="custom">Custom</option></select>
    </div>
    <div class="form-row"><label>Custom URL (%s)</label><input id="customEng"></div>
    <div class="form-row"><label data-i18n="kbEmbed">KB</label>
      <select id="kbEmbed"><option value="text" data-i18n="kbEmbedText">Text</option><option value="vector" data-i18n="kbEmbedVector">Vector (EmbeddingGemma)</option></select>
    </div>
    <div class="form-row"><label>Python 与虚拟机</label><div id="pySettings" class="py-settings"></div></div>
    <div class="row-actions">
      <button type="button" class="primary" id="btnSave" data-i18n="save">Save</button>
      <button type="button" id="btnTest" data-i18n="testConn">Test</button>
      <button type="button" id="btnCloseSettings">OK</button>
    </div>
    <p class="note-desk" data-i18n="deskNote"></p>
  </div>
</div>
<script src="js/thread.js"></script>
<script src="js/v36.js"></script>
<script src="js/model-catalog.js"></script>
<script src="js/model-picker.js"></script>
<script src="js/runpanel.js"></script>
<script src="js/vkeyboard.js"></script>
<script src="js/fzstd.js"></script>
<script src="js/zim-reader.js"></script>
<script src="js/zim-web.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/py-settings.js"></script>
</body>
</html>
