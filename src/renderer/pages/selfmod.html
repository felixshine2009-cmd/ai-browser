<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src aibrowser:; style-src aibrowser: 'unsafe-inline'; img-src * data: blob:; font-src aibrowser: data:; connect-src aibrowser:;">
<title>Self-mod</title>
<link rel="stylesheet" href="aibrowser://static/shared.css"/>
<link rel="stylesheet" href="aibrowser://static/app.css"/>
<style>
.sm{max-width:900px;margin:0 auto;padding:20px 24px 40px}
.sm h1{margin:0 0 8px;font-size:20px}
.sm .sub{color:var(--muted);margin:0 0 16px}
.sm .banner{padding:10px 12px;border-radius:8px;margin:0 0 14px;background:#3a1a1a;color:#fecaca}
.sm .banner.ok{background:#163528;color:#b7f0cf}
.sm pre.diff{background:#0b1416;border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;max-height:40vh;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.sm .file{margin:0 0 16px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--panel)}
.sm .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}
.sm .hist{list-style:none;padding:0;margin:0}
.sm .hist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.sm .tag{font-size:11px;padding:2px 6px;border-radius:999px;background:#1e2c30}
.sm .tag.applied{background:#163528;color:#b7f0cf}
.sm .tag.pending{background:#3a2a10;color:#fde047}
.sm .tag.rolled_back,.sm .tag.rejected{background:#3a1a1a;color:#fecaca}
</style>
</head>
<body class="page"><div class="page-root"><div class="sm" id="root"></div></div>
<script src="aibrowser://static/i18n.js"></script>
<script src="aibrowser://static/confirm.js"></script>
<script src="aibrowser://static/selfmod.js"></script>
</body></html>
