<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src aibrowser:; style-src aibrowser: 'unsafe-inline'; img-src * data: blob:; font-src aibrowser: data:; connect-src aibrowser:; frame-src aibdict: aibext: aibrowser:; media-src aibdict: aibext:">
<title>AI 浏览器</title>
<link rel="stylesheet" href="aibrowser://static/shared.css"/>
<link rel="stylesheet" href="aibrowser://static/app.css"/>
</head>
<body class="chrome-body">
<div class="window chrome-root">
  <div class="tabbar">
    <div class="traffic"></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="toolbar">
    <div class="tb-btn disabled" id="back" data-i18n-title="nav.back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></div>
    <div class="tb-btn disabled" id="fwd" data-i18n-title="nav.forward"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></div>
    <div class="tb-btn" id="reload" data-i18n-title="nav.reload"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5"/></svg></div>
    <div class="mode-seg" id="modeseg">
      <div class="seg ai" data-mode="chat" data-i18n="mode.chat">Chat</div>
      <div class="seg" data-mode="search" data-i18n="mode.search">Search</div>
    </div>
    <div class="address-wrap">
      <div class="address">
        <span class="lock" id="lock"></span>
        <input class="url" id="addr" spellcheck="false" autocomplete="off" data-i18n-placeholder="addr.start"/>
      </div>
    </div>
    <div class="tb-right">
      <div class="tool-cluster" id="toolcluster">
        <button type="button" class="tb-btn tool-fold" id="toolfold" title="收起或展开工具栏" aria-expanded="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 6.5L8 9l2.5-2.5"/></svg></button>
        <div class="tool-icons" id="toolicons">
          <button type="button" class="ticon" data-tool="geogebra" title="GeoGebra" aria-label="GeoGebra"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13.5h12M2.5 14V2"/><path d="M3 11.5c2.2-6 4.8-6 7-1.5s2.5 1.5 3.5-3"/><circle cx="6.5" cy="7" r="1.3"/><circle cx="11.5" cy="9.5" r="1.3"/></svg></button>
          <button type="button" class="ticon" data-tool="physics" title="物理" aria-label="物理"><svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="6.5" ry="2.6" transform="rotate(-30 8 8)"/><ellipse cx="8" cy="8" rx="6.5" ry="2.6" transform="rotate(30 8 8)"/><circle cx="8" cy="8" r="1.2"/></svg></button>
          <button type="button" class="ticon" data-tool="solve" title="解题" aria-label="解题"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12" rx="2"/><path d="M5.2 6.2l1.6 1.6 3.8-3.4"/><path d="M5.2 10.8h5.6"/></svg></button>
          <button type="button" class="ticon" data-tool="wiki" title="百科" aria-label="百科"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><ellipse cx="8" cy="8" rx="2.6" ry="6"/><path d="M2.3 6h11.4M2.3 10h11.4"/></svg></button>
          <button type="button" class="ticon" data-tool="dict" title="词典" aria-label="词典"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5c1.8-.6 4.2-.6 6 .5 1.8-1.1 4.2-1.1 6-.5v9.2c-1.8-.6-4.2-.6-6 .5-1.8-1.1-4.2-1.1-6-.5z"/><path d="M8 4v9.2"/></svg></button>
        </div>
      </div>
      <button type="button" class="tb-btn siri-btn" id="siri" title="Siri" aria-label="Siri">
        <svg class="siri-orb" viewBox="0 0 20 20" aria-hidden="true">
          <defs>
            <radialGradient id="orbBg" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#6ee7b7"/>
              <stop offset="45%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#4f46e5"/>
            </radialGradient>
            <linearGradient id="orbRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
              <stop offset="50%" stop-color="#a5f3fc" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#818cf8" stop-opacity="0.75"/>
            </linearGradient>
          </defs>
          <circle class="orb-core" cx="10" cy="10" r="7.5" fill="url(#orbBg)"/>
          <path class="orb-wave" d="M3.2 10.4c2.2-2.6 4.6-2.4 6.8 0s4.6 2.6 6.8 0" fill="none" stroke="url(#orbRing)" stroke-width="1.5" stroke-linecap="round"/>
          <circle class="orb-shine" cx="7.4" cy="7.2" r="2.1" fill="#ffffff" fill-opacity="0.38"/>
          <circle class="orb-rim" cx="10" cy="10" r="7.5" fill="none" stroke="url(#orbRing)" stroke-width="0.9"/>
        </svg>
      </button>
      <button class="cws-add" id="cwsadd" hidden></button>
      <div class="tb-btn" id="bookmark" data-i18n-title="nav.bookmark"><svg viewBox="0 0 16 16"><path d="M4 2.5h8v11L8 10.5l-4 3z"/></svg></div>
      <div class="tb-btn menu-trigger" id="menu" data-i18n-title="menu.title"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></div>
    </div>
  </div>
</div>
<script src="aibrowser://static/i18n.js"></script>
<script src="aibrowser://static/chrome.js"></script>
</body></html>
